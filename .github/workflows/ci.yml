name: ci

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main"]
  schedule:
    # Nightly at 02:00 UTC (L5, L6, L7, capability surface)
    - cron: "0 2 * * *"

# ── Fast jobs — run on every push/PR ─────────────────────────────────────────
jobs:
  fast:
    name: "Fast tests (L0–L4 + L8 + L9)"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        py: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip

      - name: Install package + test dependencies
        run: pip install -r requirements.txt pytest-benchmark

      - name: Static type checking (mypy --strict)
        run: mypy --strict signal9/
        continue-on-error: true   # Type checking is advisory until Phase 0 completes

      - name: L0 contracts
        run: pytest tests/L0_contracts/ -v -q

      - name: L1 golden vectors
        run: pytest tests/L1_golden/ -v -q

      - name: L2 property-based
        run: pytest tests/L2_property/ -v -q
        continue-on-error: true   # Graceful skip if hypothesis not installed

      - name: L3 metamorphic
        run: pytest tests/L3_metamorphic/ -v -q

      - name: L4 differential
        run: pytest tests/L4_differential/ -v -q

      - name: L8 golden regression (R3 — NEVER allowed to fail)
        run: pytest tests/L8_regression/ -v -q --tb=short

      - name: L9 performance benchmarks
        run: |
          pytest tests/L9_perf/ -v -q \
            --benchmark-compare \
            --benchmark-compare-fail=mean:15%
        continue-on-error: true   # First run establishes the baseline

  # ── JIT-off job — A7 gate ──────────────────────────────────────────────────
  jit_off:
    name: "JIT-off determinism (A7)"
    runs-on: ubuntu-latest
    env:
      NUMBA_DISABLE_JIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest-benchmark
      - name: L0 with JIT disabled (decisions must be identical)
        run: pytest tests/L0_contracts/ tests/L8_regression/ -v -q
      - name: Assert no JIT-path divergence
        run: pytest tests/L7_chaos/test_jit_parity.py -v -q
        continue-on-error: true   # File may not exist yet

  # ── Nightly — L5, L6, L7, capability surface ───────────────────────────────
  nightly:
    name: "Nightly (L5 + L6 + L7 + capability surface)"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest-benchmark

      - name: L5 Monte-Carlo sweep (20k cases)
        run: python tests/L5_montecarlo/run_sweep.py --cases 20000 --out reports/l5_nightly.jsonl
        continue-on-error: true

      - name: Capability surface HTML
        run: python tools/capability_surface.py --results reports/l5_nightly.jsonl --out reports/
        continue-on-error: true

      - name: L6 fuzz (atheris, 1M executions)
        run: python tests/L6_fuzz/fuzz_ingest.py --runs 1000000
        continue-on-error: true

      - name: L7 chaos tests
        run: pytest tests/L7_chaos/ -v -q
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
